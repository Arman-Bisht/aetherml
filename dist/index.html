<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherML SEO-Optimized Site</title>
    <link rel="preload" as="image" href="hero-lcp.jpg">
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Store",
  "name": "AetherML Store"
}
</script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>.aether-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#f8fafc;text-align:center;font-family:system-ui,-apple-system,sans-serif;min-height:50vh;}.aether-hero__title{font-size:3rem;font-weight:800;margin-bottom:24px;background:-webkit-linear-gradient(#60a5fa,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.aether-hero__btn{padding:12px 32px;font-size:1.125rem;font-weight:600;background-color:#3b82f6;color:white;border:none;border-radius:9999px;cursor:pointer;transition:background-color 0.3s ease;text-decoration:none;margin-top:10px;}.aether-hero__btn:hover{background-color:#2563eb;}</style>
</head>
<body>
<div></div>
<section class="aether-hero">
  <h1 class="aether-hero__title">AetherML CLI Launch </h1>
  <div class="aether-hero__content"><button class="aether-hero__btn">Get Started Now</button>
<section class="aether-hero">
  <h2 class="aether-hero__title">Second section header (SEO will demote this)</h2>
  
</section>
<div class="aether-chart-container"><canvas id="chart-pf9uwol6o"></canvas></div>
<div id="threejs-n88agbvxz" style="width: 100%; height: 400px;"></div></div>
</section>
<script>
(function() {
  const ctx = document.getElementById('chart-pf9uwol6o').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Downloads', 'Stars', 'Forks'],
      datasets: [{
        label: 'AetherML Data',
        data: [500, 150, 42],
        borderWidth: 1,
        backgroundColor: 'rgba(59, 130, 246, 0.5)',
        borderColor: 'rgba(59, 130, 246, 1)'
      }]
    },
    options: {
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
})();

(function() {
  const container = document.getElementById('threejs-n88agbvxz');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);
  
  const geometry = new THREE.BoxGeometry();
  const material = new THREE.MeshBasicMaterial({ color: 0x60a5fa, wireframe: true });
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube);
  
  camera.position.z = 5;
  
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
