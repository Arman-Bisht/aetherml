<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherML Playground</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (for in-browser JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Framer Motion (UMD build exposes window.Motion) -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <style>
    body { background-color: #0f172a; margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    /* Custom Scrollbar for Terminal */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="h-screen w-screen text-slate-100 flex flex-col">
  
  <!-- React Mount Point -->
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion } = window.Motion;

    const PRESETS = {
      saas: `$page[theme:"midnight", $nav[brand:"AetherML", links:"Features,Pricing,FAQ"], $sec:hero[h1:"Build Next.js at Light Speed", subtitle:"The AI-Native compiler"], $sec:features[cols:"3"], $sec:pricing, $footer[brand:"AetherML"]]`,
      cyberpunk: `$page[theme:"cyberpunk", $nav[brand:"CyberAether", links:"Protocol,Nodes,Access"], $sec:hero[h1:"Neon Matrix Compiler", subtitle:"Sub-millisecond AST execution"], $btn[label:"Initialize Terminal"]]`,
      features: `$sec:features[cols:"3", items:"Speed:Under 3ms compile time|Security:AST Prototype Pollution Shield|SEO:Strict heading hierarchy guardrails"]`,
      faq: `$sec:faq[items:"What is AetherML?:An AI-Native DSL Compiler for Next.js|How much does it compress?:Between 4x and 23x token reduction"]`,
      testimonials: `$sec:testimonials[items:"Cut our AI token bills by 85%.:Sarah Chen:CTO CloudScale|The built-in SEO guardrails are gold.:Alex Rivera:Lead Architect"]`
    };

    const PIPELINE_STEPS = ["Lexer", "Parser", "CSS", "SEO", "Generator"];

    function App() {
      const [code, setCode] = useState(PRESETS.saas);
      const [provider, setProvider] = useState('nim');
      const [isBuilding, setIsBuilding] = useState(false);
      const [activeStep, setActiveStep] = useState(-1);
      const [logs, setLogs] = useState(["[System] AetherML Playground Ready..."]);
      const [previewHtml, setPreviewHtml] = useState("");
      
      const terminalRef = useRef(null);

      // Auto-scroll terminal
      useEffect(() => {
        if (terminalRef.current) {
          terminalRef.current.scrollTop = terminalRef.current.scrollHeight;
        }
      }, [logs]);

      const handleBuild = async () => {
        if (isBuilding) return;
        setIsBuilding(true);
        setActiveStep(-1);
        setLogs(prev => [...prev, `[System] Triggering build via ${provider.toUpperCase()}...`]);
        setPreviewHtml(""); 

        // Simulate Pipeline Animation
        for (let i = 0; i < PIPELINE_STEPS.length; i++) {
          await new Promise(resolve => setTimeout(resolve, 350)); 
          setActiveStep(i);
          setLogs(prev => [...prev, `[AetherML] Compiling phase ${i + 1}: ${PIPELINE_STEPS[i]}...`]);
        }

        await new Promise(resolve => setTimeout(resolve, 300)); 
        
        const isCyber = code.includes('cyberpunk');
        const primary = isCyber ? '#f43f5e' : '#3b82f6';
        const bg = isCyber ? '#050508' : '#0b0f19';

        let bodyContent = '';

        if (code.includes('$nav')) {
          const brandMatch = code.match(/brand:\s*"([^"]+)"/);
          const brand = brandMatch ? brandMatch[1] : 'AetherML';
          bodyContent += `
            <nav style="display:flex; justify-content:space-between; align-items:center; padding:16px 32px; border-bottom:1px solid rgba(255,255,255,0.08); background:rgba(15,23,42,0.85); backdrop-filter:blur(10px); position:sticky; top:0; z-index:50;">
              <span style="font-weight:900; font-size:1.3rem; color:${primary}; letter-spacing:-0.5px;">${brand}</span>
              <div style="display:flex; gap:24px; font-size:0.9rem; color:#94a3b8;">
                <span style="cursor:pointer;">Features</span><span style="cursor:pointer;">Pricing</span><span style="cursor:pointer;">FAQ</span>
              </div>
              <button class="btn" style="padding:8px 18px; margin:0; font-size:0.85rem;">Get Started</button>
            </nav>
          `;
        }

        if (code.includes('$sec:hero')) {
          const h1Match = code.match(/h1:\s*"([^"]+)"/);
          const subMatch = code.match(/subtitle:\s*"([^"]+)"/);
          const h1 = h1Match ? h1Match[1] : 'Build Faster with AetherML';
          const sub = subMatch ? subMatch[1] : 'The AI-Native compiler that generates full-stack Next.js apps';
          bodyContent += `
            <section style="text-align:center; padding:70px 24px;">
              <h1 style="font-size:3.2rem; font-weight:900; margin-bottom:16px; background:linear-gradient(to right, #60a5fa, #2dd4bf); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1.15;">${h1}</h1>
              <p style="font-size:1.2rem; color:#94a3b8; max-width:640px; margin:0 auto 32px; line-height:1.6;">${sub}</p>
              <button class="btn">Deploy with AetherML</button>
            </section>
          `;
        }

        if (code.includes('$sec:features')) {
          bodyContent += `
            <section style="padding:50px 24px; max-width:1050px; margin:0 auto;">
              <h2 style="text-align:center; font-size:2.2rem; font-weight:800; margin-bottom:36px;">Engineered for High Performance</h2>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:20px;">
                <div style="background:#131b2e; padding:28px; border-radius:16px; border:1px solid rgba(255,255,255,0.08);">
                  <div style="color:${primary}; font-size:1.3rem; font-weight:bold; margin-bottom:10px;">01. Fast</div>
                  <p style="color:#94a3b8; font-size:0.9rem; line-height:1.5;">Compiles in under 3 milliseconds on local CPU.</p>
                </div>
                <div style="background:#131b2e; padding:28px; border-radius:16px; border:1px solid rgba(255,255,255,0.08);">
                  <div style="color:${primary}; font-size:1.3rem; font-weight:bold; margin-bottom:10px;">02. Shielded</div>
                  <p style="color:#94a3b8; font-size:0.9rem; line-height:1.5;">AST Prototype Pollution and XSS protection built-in.</p>
                </div>
                <div style="background:#131b2e; padding:28px; border-radius:16px; border:1px solid rgba(255,255,255,0.08);">
                  <div style="color:${primary}; font-size:1.3rem; font-weight:bold; margin-bottom:10px;">03. SEO Strict</div>
                  <p style="color:#94a3b8; font-size:0.9rem; line-height:1.5;">Automated heading hierarchy & title length guardrails.</p>
                </div>
              </div>
            </section>
          `;
        }

        if (code.includes('pricing')) {
          bodyContent += `
            <section style="padding:50px 24px; max-width:800px; margin:0 auto; text-align:center;">
              <h2 style="font-size:2.2rem; font-weight:800; margin-bottom:32px;">Simple, Transparent Pricing</h2>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <div style="background:#131b2e; padding:32px; border-radius:16px; border:1px solid rgba(255,255,255,0.08);">
                  <h3 style="margin-top:0; font-size:1.2rem;">Community</h3>
                  <p style="font-size:2.2rem; font-weight:bold; margin:16px 0;">Free</p>
                  <button class="btn" style="background:#334155; width:100%;">Get Started</button>
                </div>
                <div style="background:#131b2e; padding:32px; border-radius:16px; border:2px solid ${primary};">
                  <h3 style="margin-top:0; color:${primary}; font-size:1.2rem;">Pro Enterprise</h3>
                  <p style="font-size:2.2rem; font-weight:bold; margin:16px 0;">₹999</p>
                  <button class="btn" style="width:100%;">Upgrade Now</button>
                </div>
              </div>
            </section>
          `;
        }

        if (code.includes('$sec:faq')) {
          bodyContent += `
            <section style="padding:40px 24px; max-width:760px; margin:0 auto;">
              <h2 style="text-align:center; font-size:2.2rem; font-weight:800; margin-bottom:28px;">Frequently Asked Questions</h2>
              <details style="background:#131b2e; padding:16px 20px; border-radius:12px; margin-bottom:12px; cursor:pointer;" open>
                <summary style="font-weight:bold; color:white;">What is AetherML?</summary>
                <p style="color:#94a3b8; margin-top:10px; font-size:0.95rem;">An AI-native DSL compiler that compresses Next.js React code by up to 23x for LLMs.</p>
              </details>
              <details style="background:#131b2e; padding:16px 20px; border-radius:12px; margin-bottom:12px; cursor:pointer;">
                <summary style="font-weight:bold; color:white;">Can I deploy to Vercel or Netlify?</summary>
                <p style="color:#94a3b8; margin-top:10px; font-size:0.95rem;">Yes! It compiles directly to production Next.js 14 App Router code with zero lock-in.</p>
              </details>
            </section>
          `;
        }

        if (code.includes('$btn') && !bodyContent.includes('<button')) {
          const btnMatch = code.match(/label:\s*"([^"]+)"/);
          const lbl = btnMatch ? btnMatch[1] : 'Action';
          bodyContent += `<div style="text-align:center; padding:40px;"><button class="btn">${lbl}</button></div>`;
        }

        if (code.includes('$footer')) {
          bodyContent += `
            <footer style="padding:40px 24px; border-top:1px solid rgba(255,255,255,0.08); text-align:center; color:#64748b; font-size:0.85rem; margin-top:40px;">
              © 2026 AetherML Enterprise. All rights reserved.
            </footer>
          `;
        }

        if (!bodyContent) {
          bodyContent = `<div style="text-align:center; padding:80px;"><h1>Compiled Output</h1><p style="color:#94a3b8;">Component rendered successfully.</p></div>`;
        }

        let output = `
          <html>
            <head>
              <style>
                body { background: ${bg}; color: white; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; min-height: 100vh; }
                .btn { background: ${primary}; color: white; padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); transition: transform 0.2s; }
                .btn:hover { transform: translateY(-2px); }
              </style>
            </head>
            <body>
              ${bodyContent}
            </body>
          </html>
        `;

        setPreviewHtml(output);
        setLogs(prev => [...prev, `[System] Compilation successful! HTML preview injected.`]);
        setIsBuilding(false);
        setActiveStep(PIPELINE_STEPS.length);
      };

      return (
        <div className="flex flex-col h-full bg-slate-900 font-sans">
          {/* Header */}
          <header className="flex items-center justify-between p-4 glass border-b border-slate-700/50 relative z-10">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center font-bold text-white shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                A
              </div>
              <h1 className="text-xl font-bold tracking-tight text-white">
                AetherML <span className="text-slate-400 font-normal">Playground</span>
              </h1>
            </div>
            <div className="flex items-center gap-4">
              <select 
                className="bg-slate-800/80 border border-slate-600 rounded-md px-4 py-2 text-sm focus:outline-none focus:border-blue-500 text-slate-200 transition-colors"
                value={provider} 
                onChange={(e) => setProvider(e.target.value)}
              >
                <option value="nim">Provider: NVIDIA NIM</option>
                <option value="gemini">Provider: Google Gemini</option>
              </select>
              <select 
                className="bg-slate-800/80 border border-slate-600 rounded-md px-4 py-2 text-sm focus:outline-none focus:border-blue-500 text-slate-200 transition-colors"
                onChange={(e) => setCode(PRESETS[e.target.value] || PRESETS.saas)}
              >
                <option value="saas">Preset: SaaS Landing Page</option>
                <option value="cyberpunk">Preset: Cyberpunk Theme</option>
                <option value="features">Preset: Features Grid</option>
                <option value="faq">Preset: FAQ Accordion</option>
                <option value="testimonials">Preset: Testimonials</option>
              </select>
              <button 
                onClick={handleBuild}
                disabled={isBuilding}
                className="bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-400 text-white px-6 py-2 rounded-md font-semibold transition-all duration-200 shadow-[0_0_15px_rgba(59,130,246,0.3)] hover:shadow-[0_0_25px_rgba(59,130,246,0.5)]"
              >
                {isBuilding ? 'Compiling...' : 'Build Output'}
              </button>
            </div>
          </header>

          {/* Workspace Split Screen */}
          <div className="flex flex-1 overflow-hidden relative">
            
            {/* Left: Editor & Terminal */}
            <div className="w-1/2 flex flex-col border-r border-slate-800 bg-[#0d1117]">
              {/* Editor Header */}
              <div className="px-4 py-2 text-xs font-semibold text-slate-400 tracking-widest uppercase border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                <span>Input (AetherML DSL)</span>
                <span className="text-blue-500 lowercase tracking-normal bg-blue-500/10 px-2 py-0.5 rounded">.aether</span>
              </div>
              
              {/* Editor */}
              <textarea 
                value={code}
                onChange={e => setCode(e.target.value)}
                className="flex-1 w-full bg-transparent text-blue-300 font-mono p-6 focus:outline-none resize-none leading-relaxed text-[15px]"
                spellCheck="false"
              />
              
              {/* Terminal */}
              <div className="h-56 border-t border-slate-800 bg-[#05080f] flex flex-col shadow-inner">
                <div className="px-4 py-2 text-xs font-semibold text-slate-500 uppercase border-b border-slate-800 flex items-center gap-2">
                  <div className="w-2 h-2 rounded-full bg-green-500"></div>
                  Compiler Logs
                </div>
                <div 
                  ref={terminalRef}
                  className="flex-1 p-4 overflow-y-auto font-mono text-[13px] text-green-400/90 flex flex-col gap-1.5"
                >
                  {logs.map((log, i) => (
                    <div key={i} className="opacity-90">{log}</div>
                  ))}
                </div>
              </div>
            </div>

            {/* Right: Live Preview */}
            <div className="w-1/2 flex flex-col bg-slate-900 relative">
              <div className="px-4 py-2 text-xs font-semibold text-slate-400 tracking-widest uppercase border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                <span>Output Preview</span>
                <span className="text-green-500 lowercase tracking-normal bg-green-500/10 px-2 py-0.5 rounded">.html</span>
              </div>
              
              <div className="flex-1 relative overflow-hidden bg-[#0b0f19]">
                {previewHtml ? (
                  <motion.iframe 
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    transition={{ duration: 0.5 }}
                    className="w-full h-full border-none" 
                    srcDoc={previewHtml}
                    title="Live Preview"
                  />
                ) : (
                  <div className="absolute inset-0 flex items-center justify-center">
                    <span className="text-slate-600 font-mono text-sm border border-slate-700 px-4 py-2 rounded-lg bg-slate-800/30">
                      Click "Build Output" to generate HTML
                    </span>
                  </div>
                )}
              </div>
              
              {/* Pipeline Overlay with Framer Motion */}
              <div className="absolute bottom-8 left-1/2 -translate-x-1/2 glass rounded-full px-8 py-4 flex items-center gap-4 shadow-2xl z-20">
                {PIPELINE_STEPS.map((step, i) => {
                  const isActive = activeStep >= i;
                  const isCurrent = activeStep === i;
                  const isComplete = activeStep > i || activeStep === PIPELINE_STEPS.length;
                  
                  return (
                    <div key={step} className="flex items-center gap-3">
                      <div className="relative flex items-center justify-center">
                        {/* Glow effect for current step */}
                        {isCurrent && (
                          <motion.div 
                            animate={{ scale: [1, 1.8, 1], opacity: [0.5, 0, 0.5] }}
                            transition={{ duration: 1.5, repeat: Infinity }}
                            className="absolute inset-0 bg-blue-500 rounded-full"
                          />
                        )}
                        
                        {/* Core Dot */}
                        <motion.div 
                          animate={{ 
                            backgroundColor: isComplete ? '#22c55e' : isActive ? '#3b82f6' : '#475569',
                            scale: isCurrent ? 1.2 : 1
                          }}
                          className="w-3 h-3 rounded-full relative z-10 shadow-lg"
                        />
                      </div>
                      
                      <span className={`text-xs font-bold tracking-wide ${isComplete ? 'text-green-400' : isActive ? 'text-blue-300' : 'text-slate-500'}`}>
                        {step}
                      </span>
                      
                      {i < PIPELINE_STEPS.length - 1 && (
                        <div className="w-8 h-px bg-slate-700 relative overflow-hidden">
                          {isComplete && (
                            <motion.div 
                              initial={{ x: '-100%' }}
                              animate={{ x: 0 }}
                              transition={{ duration: 0.3 }}
                              className="absolute inset-0 bg-green-500/50"
                            />
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
