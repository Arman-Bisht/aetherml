<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherML Playground</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (for in-browser JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Framer Motion (UMD build exposes window.Motion) -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <style>
    body { background-color: #0f172a; margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    /* Custom Scrollbar for Terminal */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="h-screen w-screen text-slate-100 flex flex-col">
  
  <!-- React Mount Point -->
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion } = window.Motion;

    const PRESETS = {
      hero: '$sec:hero[h1:"AetherML Engine", $btn[label:"Deploy Now"]]',
      chart: '$plugin:chart[type:"bar", labels:"Q1|Q2|Q3|Q4", data:"50|120|200|350"]',
      model: '$plugin:3d[model:"startup-logo", spin:"true"]'
    };

    const PIPELINE_STEPS = ["Lexer", "Parser", "CSS", "SEO", "Generator"];

    function App() {
      const [code, setCode] = useState(PRESETS.hero);
      const [provider, setProvider] = useState('nim');
      const [isBuilding, setIsBuilding] = useState(false);
      const [activeStep, setActiveStep] = useState(-1);
      const [logs, setLogs] = useState(["[System] AetherML Playground Ready..."]);
      const [previewHtml, setPreviewHtml] = useState("");
      
      const terminalRef = useRef(null);

      // Auto-scroll terminal
      useEffect(() => {
        if (terminalRef.current) {
          terminalRef.current.scrollTop = terminalRef.current.scrollHeight;
        }
      }, [logs]);

      const handleBuild = async () => {
        if (isBuilding) return;
        setIsBuilding(true);
        setActiveStep(-1);
        setLogs(prev => [...prev, `[System] Triggering build via ${provider.toUpperCase()}...`]);
        setPreviewHtml(""); 

        // Simulate Pipeline Animation
        for (let i = 0; i < PIPELINE_STEPS.length; i++) {
          await new Promise(resolve => setTimeout(resolve, 500)); 
          setActiveStep(i);
          setLogs(prev => [...prev, `[AetherML] Compiling phase ${i + 1}: ${PIPELINE_STEPS[i]}...`]);
        }

        await new Promise(resolve => setTimeout(resolve, 600)); 
        
        // Mock output generation logic purely for visual preview
        let output = `
          <html>
            <head>
              <style>
                body { background: #0b0f19; color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
                .btn { background: #3b82f6; color: white; padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; margin-top: 24px; cursor: pointer; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); transition: transform 0.2s; }
                .btn:hover { transform: translateY(-2px); }
                .hero { text-align: center; }
                h1 { font-size: 3rem; background: -webkit-linear-gradient(#fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
                .chart-container { width: 400px; height: 250px; background: #1e293b; border-radius: 16px; padding: 24px; display: flex; align-items: flex-end; justify-content: space-around; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
                .bar { width: 40px; background: linear-gradient(180deg, #3b82f6 0%, #1e3a8a 100%); border-radius: 6px 6px 0 0; position: relative; }
                .bar span { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: bold; color: #94a3b8; }
                .model { width: 250px; height: 250px; border: 4px dashed #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: spin 4s linear infinite; box-shadow: 0 0 40px rgba(59, 130, 246, 0.2); }
                @keyframes spin { 100% { transform: rotate(360deg); } }
              </style>
            </head>
            <body>
        `;
        
        if (code.includes('hero')) {
          output += `<div class="hero"><h1>AetherML Engine</h1><button class="btn">Deploy Now</button></div>`;
        } else if (code.includes('chart')) {
          output += `
            <div class="chart-container">
              <div class="bar" style="height: 20%"><span>Q1</span></div>
              <div class="bar" style="height: 40%"><span>Q2</span></div>
              <div class="bar" style="height: 70%"><span>Q3</span></div>
              <div class="bar" style="height: 100%"><span>Q4</span></div>
            </div>`;
        } else if (code.includes('3d')) {
          output += `<div class="model"><h2 style="color: #60a5fa; margin:0;">3D Render</h2></div>`;
        } else {
          output += `<div><h1 style="color: #3b82f6;">Compiled Successfully!</h1></div>`;
        }

        output += `</body></html>`;

        setPreviewHtml(output);
        setLogs(prev => [...prev, `[System] Compilation successful! HTML injected.`]);
        setIsBuilding(false);
        setActiveStep(PIPELINE_STEPS.length); // All complete
      };

      return (
        <div className="flex flex-col h-full bg-slate-900 font-sans">
          {/* Header */}
          <header className="flex items-center justify-between p-4 glass border-b border-slate-700/50 relative z-10">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center font-bold text-white shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                A
              </div>
              <h1 className="text-xl font-bold tracking-tight text-white">
                AetherML <span className="text-slate-400 font-normal">Playground</span>
              </h1>
            </div>
            <div className="flex items-center gap-4">
              <select 
                className="bg-slate-800/80 border border-slate-600 rounded-md px-4 py-2 text-sm focus:outline-none focus:border-blue-500 text-slate-200 transition-colors"
                value={provider} 
                onChange={(e) => setProvider(e.target.value)}
              >
                <option value="nim">Provider: NVIDIA NIM</option>
                <option value="gemini">Provider: Google Gemini</option>
              </select>
              <select 
                className="bg-slate-800/80 border border-slate-600 rounded-md px-4 py-2 text-sm focus:outline-none focus:border-blue-500 text-slate-200 transition-colors"
                onChange={(e) => setCode(PRESETS[e.target.value])}
              >
                <option value="hero">Preset: Hero Section</option>
                <option value="chart">Preset: Dashboard Chart</option>
                <option value="model">Preset: 3D Model</option>
              </select>
              <button 
                onClick={handleBuild}
                disabled={isBuilding}
                className="bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-400 text-white px-6 py-2 rounded-md font-semibold transition-all duration-200 shadow-[0_0_15px_rgba(59,130,246,0.3)] hover:shadow-[0_0_25px_rgba(59,130,246,0.5)]"
              >
                {isBuilding ? 'Compiling...' : 'Build Output'}
              </button>
            </div>
          </header>

          {/* Workspace Split Screen */}
          <div className="flex flex-1 overflow-hidden relative">
            
            {/* Left: Editor & Terminal */}
            <div className="w-1/2 flex flex-col border-r border-slate-800 bg-[#0d1117]">
              {/* Editor Header */}
              <div className="px-4 py-2 text-xs font-semibold text-slate-400 tracking-widest uppercase border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                <span>Input (AetherML DSL)</span>
                <span className="text-blue-500 lowercase tracking-normal bg-blue-500/10 px-2 py-0.5 rounded">.aether</span>
              </div>
              
              {/* Editor */}
              <textarea 
                value={code}
                onChange={e => setCode(e.target.value)}
                className="flex-1 w-full bg-transparent text-blue-300 font-mono p-6 focus:outline-none resize-none leading-relaxed text-[15px]"
                spellCheck="false"
              />
              
              {/* Terminal */}
              <div className="h-56 border-t border-slate-800 bg-[#05080f] flex flex-col shadow-inner">
                <div className="px-4 py-2 text-xs font-semibold text-slate-500 uppercase border-b border-slate-800 flex items-center gap-2">
                  <div className="w-2 h-2 rounded-full bg-green-500"></div>
                  Compiler Logs
                </div>
                <div 
                  ref={terminalRef}
                  className="flex-1 p-4 overflow-y-auto font-mono text-[13px] text-green-400/90 flex flex-col gap-1.5"
                >
                  {logs.map((log, i) => (
                    <div key={i} className="opacity-90">{log}</div>
                  ))}
                </div>
              </div>
            </div>

            {/* Right: Live Preview */}
            <div className="w-1/2 flex flex-col bg-slate-900 relative">
              <div className="px-4 py-2 text-xs font-semibold text-slate-400 tracking-widest uppercase border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                <span>Output Preview</span>
                <span className="text-green-500 lowercase tracking-normal bg-green-500/10 px-2 py-0.5 rounded">.html</span>
              </div>
              
              <div className="flex-1 relative overflow-hidden bg-[#0b0f19]">
                {previewHtml ? (
                  <motion.iframe 
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    transition={{ duration: 0.5 }}
                    className="w-full h-full border-none" 
                    srcDoc={previewHtml}
                    title="Live Preview"
                  />
                ) : (
                  <div className="absolute inset-0 flex items-center justify-center">
                    <span className="text-slate-600 font-mono text-sm border border-slate-700 px-4 py-2 rounded-lg bg-slate-800/30">
                      Click "Build Output" to generate HTML
                    </span>
                  </div>
                )}
              </div>
              
              {/* Pipeline Overlay with Framer Motion */}
              <div className="absolute bottom-8 left-1/2 -translate-x-1/2 glass rounded-full px-8 py-4 flex items-center gap-4 shadow-2xl z-20">
                {PIPELINE_STEPS.map((step, i) => {
                  const isActive = activeStep >= i;
                  const isCurrent = activeStep === i;
                  const isComplete = activeStep > i || activeStep === PIPELINE_STEPS.length;
                  
                  return (
                    <div key={step} className="flex items-center gap-3">
                      <div className="relative flex items-center justify-center">
                        {/* Glow effect for current step */}
                        {isCurrent && (
                          <motion.div 
                            animate={{ scale: [1, 1.8, 1], opacity: [0.5, 0, 0.5] }}
                            transition={{ duration: 1.5, repeat: Infinity }}
                            className="absolute inset-0 bg-blue-500 rounded-full"
                          />
                        )}
                        
                        {/* Core Dot */}
                        <motion.div 
                          animate={{ 
                            backgroundColor: isComplete ? '#22c55e' : isActive ? '#3b82f6' : '#475569',
                            scale: isCurrent ? 1.2 : 1
                          }}
                          className="w-3 h-3 rounded-full relative z-10 shadow-lg"
                        />
                      </div>
                      
                      <span className={`text-xs font-bold tracking-wide ${isComplete ? 'text-green-400' : isActive ? 'text-blue-300' : 'text-slate-500'}`}>
                        {step}
                      </span>
                      
                      {i < PIPELINE_STEPS.length - 1 && (
                        <div className="w-8 h-px bg-slate-700 relative overflow-hidden">
                          {isComplete && (
                            <motion.div 
                              initial={{ x: '-100%' }}
                              animate={{ x: 0 }}
                              transition={{ duration: 0.3 }}
                              className="absolute inset-0 bg-green-500/50"
                            />
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
